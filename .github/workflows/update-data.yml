name: Atualizar dados do painel

# Executa automaticamente a cada 6 horas (e permite rodar manualmente).
# Coleta os indicadores, atualiza data/*.json e faz commit de volta no repo.
# O GitHub Pages (servindo o branch) republica o site a cada commit.

on:
  schedule:
    # Fora do minuto 0 (pico do GitHub, quando runs atrasam/sao descartados).
    - cron: "17 */6 * * *"      # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch: {}         # botao "Run workflow" na aba Actions
  push:
    branches: [ main ]
    paths:
      - "collector/**"
      - "config/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r collector/requirements.txt

      - name: Coletar dados
        run: python collector/collect.py

      - name: Commit e push dos dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --staged --quiet; then
            echo "Sem mudancas nos dados."
            exit 0
          fi
          git commit -m "chore(dados): atualizacao automatica $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Integra commits do bot/dono (git pull --rebase) antes de empurrar, com nova tentativa.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push concluido na tentativa $i."
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando antes de tentar de novo..."
            sleep 5
          done
          echo "Push falhou apos 3 tentativas."
          exit 1
